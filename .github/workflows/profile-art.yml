name: Animaciones del perfil

on:
  schedule:
    - cron: "0 6 * * *" # una vez al día, con los datos más recientes
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["assets/telemetry.py", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Generar engine room, telemetría y campo de estrellas
        run: python3 assets/telemetry.py dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
